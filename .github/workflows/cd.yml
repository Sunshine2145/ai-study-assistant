name: CD - 自动部署

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署目标环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: '跳过测试直接部署（紧急修复用）'
        required: false
        default: false
        type: boolean

# 防止并发部署
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # Job 1: 部署前置检查（复用 CI 结果）
  # ─────────────────────────────────────────────
  pre-deploy-check:
    name: 🔎 部署前置检查
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env-check.outputs.environment }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🏷️ 解析版本号
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 部署版本: $VERSION"

      - name: 🌍 确认部署环境
        id: env-check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            ENV="production"
          else
            ENV="staging"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "🌍 目标环境: $ENV"

  # ─────────────────────────────────────────────
  # Job 2: 构建 Docker 镜像
  # ─────────────────────────────────────────────
  build-image:
    name: 🐳 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: pre-deploy-check
    # 仅当有 DOCKER_USERNAME 密钥时才构建
    if: ${{ vars.DOCKER_ENABLED == 'true' || false }}

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🐳 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-study-assistant:latest
            ${{ secrets.DOCKER_USERNAME }}/ai-study-assistant:${{ needs.pre-deploy-check.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # Job 3: 部署到服务器（SSH 方式）
  # ─────────────────────────────────────────────
  deploy-staging:
    name: 🚀 部署到 Staging
    runs-on: ubuntu-latest
    needs: [pre-deploy-check]
    if: needs.pre-deploy-check.outputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🔐 配置 SSH
        # 需要在 GitHub Secrets 中设置 SSH_PRIVATE_KEY 和 STAGING_HOST
        if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 📤 同步后端代码到服务器
        if: ${{ secrets.STAGING_HOST != '' }}
        run: |
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='database/*.db' \
            backend/ ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:${{ vars.STAGING_DEPLOY_PATH }}/backend/

      - name: 📤 同步前端代码到服务器
        if: ${{ secrets.STAGING_HOST != '' }}
        run: |
          rsync -avz --delete \
            frontend/ ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:${{ vars.STAGING_DEPLOY_PATH }}/frontend/

      - name: 🔄 重启后端服务
        if: ${{ secrets.STAGING_HOST != '' }}
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd ${{ vars.STAGING_DEPLOY_PATH }}/backend
            # 激活虚拟环境（如有）
            source venv/bin/activate 2>/dev/null || true
            # 安装/更新依赖
            pip install -r requirements.txt
            # 用 systemd 或 supervisor 重启（根据实际部署方式）
            if command -v systemctl &> /dev/null; then
              sudo systemctl restart ai-study-assistant || true
            elif command -v supervisorctl &> /dev/null; then
              supervisorctl restart ai-study-assistant || true
            else
              # 直接用 nohup 启动（fallback）
              pkill -f "run.py" || true
              nohup python run.py > logs/app.log 2>&1 &
              echo "Backend restarted with PID: $!"
            fi
          EOF

      - name: ✅ 部署后健康检查
        if: ${{ vars.STAGING_URL != '' }}
        run: |
          sleep 5
          for i in $(seq 1 10); do
            if curl -sf "${{ vars.STAGING_URL }}/health" > /dev/null 2>&1; then
              echo "✅ 服务健康检查通过"
              exit 0
            fi
            echo "等待服务启动... ($i/10)"
            sleep 3
          done
          echo "❌ 健康检查失败"
          exit 1

      - name: 📢 部署成功通知（可选）
        if: success() && vars.FEISHU_WEBHOOK != ''
        run: |
          curl -X POST "${{ vars.FEISHU_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "✅ AI伴学系统 Staging 部署成功\n版本: ${{ needs.pre-deploy-check.outputs.version }}\n提交: ${{ github.sha }}\n操作者: ${{ github.actor }}"
              }
            }' || true

  # ─────────────────────────────────────────────
  # Job 4: 部署到 Production（仅 tag 触发）
  # ─────────────────────────────────────────────
  deploy-production:
    name: 🏭 部署到 Production
    runs-on: ubuntu-latest
    needs: [pre-deploy-check]
    if: needs.pre-deploy-check.outputs.environment == 'production' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🔐 配置 SSH
        if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 📦 创建发布包
        run: |
          VERSION="${{ needs.pre-deploy-check.outputs.version }}"
          tar -czf ai-study-assistant-${VERSION}.tar.gz \
            --exclude='backend/__pycache__' \
            --exclude='backend/*.pyc' \
            --exclude='backend/.env' \
            --exclude='backend/database/*.db' \
            --exclude='node_modules' \
            backend/ frontend/
          echo "📦 发布包已创建: ai-study-assistant-${VERSION}.tar.gz"

      - name: 📤 上传发布包
        if: ${{ secrets.PROD_HOST != '' }}
        run: |
          ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts
          VERSION="${{ needs.pre-deploy-check.outputs.version }}"
          scp ai-study-assistant-${VERSION}.tar.gz \
            ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:/tmp/

      - name: 🚀 执行生产部署
        if: ${{ secrets.PROD_HOST != '' }}
        run: |
          VERSION="${{ needs.pre-deploy-check.outputs.version }}"
          ssh ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} << EOF
            set -e
            DEPLOY_PATH="${{ vars.PROD_DEPLOY_PATH }}"
            RELEASE_PATH="\${DEPLOY_PATH}/releases/${VERSION}"
            CURRENT_LINK="\${DEPLOY_PATH}/current"

            # 解压到新版本目录
            mkdir -p \${RELEASE_PATH}
            tar -xzf /tmp/ai-study-assistant-${VERSION}.tar.gz -C \${RELEASE_PATH}

            # 链接生产环境配置
            ln -sf \${DEPLOY_PATH}/shared/.env \${RELEASE_PATH}/backend/.env
            ln -sf \${DEPLOY_PATH}/shared/database \${RELEASE_PATH}/backend/database

            # 安装依赖
            cd \${RELEASE_PATH}/backend
            source venv/bin/activate 2>/dev/null || python3 -m venv venv && source venv/bin/activate
            pip install -r requirements.txt

            # 原子切换（蓝绿部署）
            ln -sfn \${RELEASE_PATH} \${CURRENT_LINK}

            # 重启服务
            sudo systemctl restart ai-study-assistant || supervisorctl restart ai-study-assistant

            # 保留最近 5 个版本，清理旧版本
            ls -dt \${DEPLOY_PATH}/releases/*/ | tail -n +6 | xargs rm -rf || true
            echo "✅ 生产部署完成: ${VERSION}"
          EOF

      - name: ✅ 生产环境健康检查
        if: ${{ vars.PRODUCTION_URL != '' }}
        run: |
          sleep 8
          for i in $(seq 1 15); do
            if curl -sf "${{ vars.PRODUCTION_URL }}/health" > /dev/null 2>&1; then
              echo "✅ 生产环境健康检查通过"
              exit 0
            fi
            echo "等待服务启动... ($i/15)"
            sleep 3
          done
          echo "❌ 生产环境健康检查失败！"
          exit 1

      - name: 🎉 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.pre-deploy-check.outputs.version }}
          name: "AI伴学系统 ${{ needs.pre-deploy-check.outputs.version }}"
          body: |
            ## 🚀 发布说明

            **版本**: ${{ needs.pre-deploy-check.outputs.version }}
            **提交**: ${{ github.sha }}
            **发布时间**: ${{ github.event.head_commit.timestamp }}

            ### 变更内容
            ${{ github.event.head_commit.message }}

            ### 部署信息
            - 后端: FastAPI + Python 3.11
            - 前端: 纯 HTML/CSS/JS（H5）
            - 数据库: SQLite
          files: |
            ai-study-assistant-${{ needs.pre-deploy-check.outputs.version }}.tar.gz
          draft: false
          prerelease: false

      - name: 📢 生产部署飞书通知
        if: always() && vars.FEISHU_WEBHOOK != ''
        run: |
          STATUS="${{ job.status }}"
          ICON="✅"
          if [ "$STATUS" != "success" ]; then ICON="❌"; fi
          curl -X POST "${{ vars.FEISHU_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"text\",
              \"content\": {
                \"text\": \"${ICON} AI伴学系统生产部署 ${STATUS}\n版本: ${{ needs.pre-deploy-check.outputs.version }}\n操作者: ${{ github.actor }}\"
              }
            }" || true
